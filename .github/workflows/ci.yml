name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push supersedes an in-flight run on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: api (ruff + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: api/uv.lock

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Test (SQLite — the zero-infra default)
        run: uv run pytest -q

      # requirements.txt is a convenience for reviewers who prefer pip; uv.lock is the
      # source of truth. Fail if the two have drifted rather than let pip users install
      # a different dependency set from the one that was tested.
      - name: Verify api/requirements.txt is up to date
        run: |
          { printf '%s\n' "# GENERATED from uv.lock by make export-reqs — do not edit"
            uv export --format requirements-txt --no-dev --no-hashes --no-emit-project
          } | diff -u - requirements.txt \
            || { echo "::error::api/requirements.txt is stale — run: make export-reqs"; exit 1; }

  api-postgres:
    name: api (postgres)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api

    # The same suite against the engine production would actually use. SQLite and
    # Postgres disagree about UUIDs, timezone handling and DDL, so a green SQLite run
    # is not evidence the Postgres path works (M4/E2).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: alma
          POSTGRES_PASSWORD: alma
          POSTGRES_DB: alma
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U alma -d alma"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://alma:alma@localhost:5432/alma

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: api/uv.lock

      - name: Install dependencies
        run: uv sync --locked

      - name: Run migrations against Postgres
        run: uv run alembic upgrade head

      - name: Verify the schema is current (no model/migration drift)
        run: uv run alembic check

      - name: Test
        run: uv run pytest -q

  web:
    name: web (lint + tsc + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      # Vitest units over lib/ and the server actions: pure, no browser, no network.
      # The browser journey lives in the separate e2e job below.
      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

  e2e:
    name: e2e (playwright)
    runs-on: ubuntu-latest

    # Runs the real browser against the real stack on the zero-infra defaults:
    # SQLite, local disk, console email. No secrets, no services.
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: api/uv.lock

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install api dependencies
        run: uv sync --locked
        working-directory: api

      - name: Install web dependencies
        run: pnpm install --frozen-lockfile
        working-directory: web

      - name: Prepare the database
        run: uv run alembic upgrade head
        working-directory: api

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
        working-directory: web

      # playwright.config.ts starts both servers itself and waits for health.
      - name: Run the smoke test
        run: pnpm exec playwright test
        working-directory: web

      - name: Upload the report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7
