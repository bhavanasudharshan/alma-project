# Optional infrastructure. The default local run needs none of it: SQLite + local
# disk + console email, no Docker ($1). Each profile is opt-in, and the app switches
# purely on environment variables -- no code change (M4/E2).
#
#   docker compose --profile pg up -d      # Postgres 16
#     then: DATABASE_URL=postgresql+psycopg://alma:alma@localhost:5432/alma
#
#   docker compose --profile s3 up -d      # MinIO + bucket bootstrap
#     then: S3_ENDPOINT_URL=http://localhost:9000
#           S3_ACCESS_KEY_ID=minioadmin
#           S3_SECRET_ACCESS_KEY=minioadmin
#           S3_BUCKET=alma-resumes

services:
  postgres:
    image: postgres:16-alpine
    profiles: ["pg"]
    environment:
      POSTGRES_USER: alma
      POSTGRES_PASSWORD: alma
      POSTGRES_DB: alma
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alma -d alma"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    profiles: ["s3"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot sidecar: creates the private resumes bucket, then exits (C1).
  minio-init:
    image: minio/mc:latest
    profiles: ["s3"]
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/alma-resumes &&
      mc anonymous set none local/alma-resumes
      "

volumes:
  pg_data:
  minio_data:
